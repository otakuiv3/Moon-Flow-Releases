name: Build, sign and publish Windows update

on:
  push:
    branches: [main]
    paths: [build-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moon-flow-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'otakuiv3/Moon-Flow-Releases' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Check out release request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: channel
          persist-credentials: false
      - name: Validate the requested source commit
        id: request
        working-directory: channel
        run: |
          $request = Get-Content -LiteralPath build-request.json -Raw | ConvertFrom-Json
          if ($request.repository -cne 'otakuiv3/-Moon-Flow' -or $request.sourceCommit -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid build request.' }
          "sha=$($request.sourceCommit)" >> $env:GITHUB_OUTPUT
          "MOONFLOW_SOURCE_SHA=$($request.sourceCommit)" >> $env:GITHUB_ENV
      - name: Read the exact private source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: otakuiv3/-Moon-Flow
          ref: ${{ steps.request.outputs.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.MOONFLOW_SOURCE_READ_KEY }}
          path: source
          persist-credentials: false
      - name: Install the tested Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false
      - name: Select next version or resume a draft
        id: version
        env:
          MOONFLOW_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-ci-release.cjs
      - name: Install locked dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund
      - name: Install both bundled browser runtimes
        if: steps.version.outputs.skip != 'true'
        run: node scripts/install-release-browsers.cjs
      - name: Check JavaScript syntax
        if: steps.version.outputs.skip != 'true'
        run: npm run check
      - name: Build the interface locally
        if: steps.version.outputs.skip != 'true'
        run: npm run build
      - name: Run isolated regression and interface tests
        if: steps.version.outputs.skip != 'true'
        run: npm test
      - name: Build installer and sign with the existing update identity
        if: steps.version.outputs.skip != 'true'
        env:
          MOONFLOW_UPDATE_SIGNING_KEY: ${{ secrets.MOONFLOW_UPDATE_SIGNING_KEY }}
        run: node scripts/package-windows.cjs
      - name: Verify signed payloads, installed upgrade and offline bundled browsers
        if: steps.version.outputs.skip != 'true'
        run: node scripts/verify-windows-release.cjs
      - name: Publish verified installers and signed metadata
        if: steps.version.outputs.skip != 'true'
        env:
          MOONFLOW_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-windows.cjs --skip-build --publish
      - name: Release summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          "Moon Flow $env:VERSION — Windows 11 x64" >> $env:GITHUB_STEP_SUMMARY
          "https://github.com/otakuiv3/Moon-Flow-Releases/releases/tag/v$env:VERSION" >> $env:GITHUB_STEP_SUMMARY
